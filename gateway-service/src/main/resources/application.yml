server:
  port: 27193

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  swagger-ui:
    path: /docs
    urls:
        - name: hall-service
          url: /hall-service/api-docs
        - name: vendor-service
          url: /vendor-service/api-docs
        - name: user-service
          url: /user-service/api-docs
        - name: proposal-service
          url: /proposal-service/api-docs
        - name: event-service
          url: /event-service/api-docs
